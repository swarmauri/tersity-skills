[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tersity-skills"
version = "0.1.0"
description = "Portable agent skills for measuring and safely reducing codebases."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
keywords = ["agent-skills", "claude", "codex", "loc", "refactoring", "sloc"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/swarmauri/tersity-skills"
Repository = "https://github.com/swarmauri/tersity-skills"
Issues = "https://github.com/swarmauri/tersity-skills/issues"

[project.scripts]
tersity-skills = "tersity_skills.cli:main"

[dependency-groups]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9", "twine>=6"]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
